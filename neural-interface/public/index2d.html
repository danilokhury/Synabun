<!DOCTYPE html>
<!-- DEPRECATED: 2D source retained on disk. Old bookmarks redirect to the 3D memory map. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SynApp</title>
<meta name="theme-color" content="#0e0e10">
<!-- Inside the SynaBun desktop app the navbar is the window's title bar (shared/desktop-titlebar.js). -->
<meta name="synabun-titlebar" content="navbar">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/vendor/caveat/caveat.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://db.onlinewebfonts.com/c/3284c3a32cf946466fb963369b3c5b2d?family=Disket+Mono" rel="stylesheet">
<link rel="stylesheet" href="/shared/styles.css">
<style>
  /* ═══════════════════════════════════════════
     2D VARIANT — Main Canvas
     ═══════════════════════════════════════════ */
  /* The graph fills the app frame (styles.css APP FRAME); graph.js sizes its buffer and reads pointers from this box.
     A canvas does not stretch between left and right: its size is written out. */
  #canvas-main {
    position: fixed;
    top: var(--frame-top); left: var(--frame-left);
    width: calc(100% - var(--sidebar-total-width, 0px) - 2 * var(--frame-gap));
    height: calc(100dvh - var(--frame-top) - var(--frame-gap));
    border-radius: var(--frame-radius);
    z-index: 1;
    cursor: move;
  }
  #canvas-main:active { cursor: move; }

  /* ═══════════════════════════════════════════
     2D VARIANT — Minimap
     ═══════════════════════════════════════════ */
  #minimap {
    position: fixed;
    bottom: 52px;
    right: 12px;
    width: 200px;
    height: 140px;
    z-index: 90;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(28,28,30,0.72);
    backdrop-filter: blur(var(--blur-heavy, 16px)) saturate(1.4);
    -webkit-backdrop-filter: blur(var(--blur-heavy, 16px)) saturate(1.4);
    box-shadow: 0 2px 20px rgba(0,0,0,0.4);
    transition: opacity 0.2s ease;
    opacity: 0; pointer-events: none;
    cursor: move;
    user-select: none;
  }
  #minimap:active { cursor: move; }
  #minimap.visible { opacity: 1; pointer-events: auto; }
  #minimap-canvas { width: 100%; height: 100%; display: block; }
  #minimap-label {
    position: absolute;
    top: 4px; left: 8px;
    font-size: 9px; font-weight: 600;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: rgba(255,255,255,0.2); pointer-events: none;
  }

  /* ═══════════════════════════════════════════
     2D VARIANT — Context Menu
     ═══════════════════════════════════════════ */
  #context-menu {
    position: fixed;
    z-index: 500;
    min-width: 180px;
    padding: 4px;
    display: none;
    animation: dropdownFadeIn 0.1s ease-out;
  }
  #context-menu.open { display: block; }
  .ctx-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; border-radius: 6px; cursor: pointer;
    font-size: 13px; color: var(--t-secondary); transition: background 0.1s;
  }
  .ctx-item:hover { background: var(--s-hover); color: var(--t-bright); }
  .ctx-item svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.8; fill: none; }
  .ctx-item--danger:hover { color: var(--accent-red); background: var(--accent-red-bg); }
  .ctx-sep { height: 1px; background: var(--b-subtle); margin: 3px 4px; }

  /* ═══════════════════════════════════════════
     2D VARIANT — Lasso Selection
     ═══════════════════════════════════════════ */
  #lasso-canvas {
    position: fixed;
    top: var(--frame-top); left: var(--frame-left);
    width: calc(100% - var(--sidebar-total-width, 0px) - 2 * var(--frame-gap));
    height: calc(100dvh - var(--frame-top) - var(--frame-gap));
    z-index: 5;
    pointer-events: none;
  }
</style>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{})</script>
</head>
<body>

<!-- 2D: Main Render Canvas -->
<canvas id="canvas-main"></canvas>

<!-- 2D: Lasso Selection Overlay -->
<canvas id="lasso-canvas"></canvas>

<!-- 2D: Minimap -->
<div id="minimap" class="glass">
  <canvas id="minimap-canvas" width="200" height="140"></canvas>
</div>

<!-- 2D: Context Menu -->
<div id="context-menu" class="glass">
  <div class="ctx-item" data-action="open">Open Memory</div>
  <div class="ctx-item" data-action="edit">Edit Memory</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-action="move">Move to Category...</div>
  <div class="ctx-item" data-action="pin">Pin / Unpin</div>
  <div class="ctx-item" data-action="focus">Focus: Show Linked</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-action="bookmark">Add to Bookmarks</div>
  <div class="ctx-item ctx-item--danger" data-action="trash">Move to Trash</div>
</div>

<!-- Redirect the deprecated entry point (also works with a static host) -->
<script type="module" src="/shared/page-session.js"></script>
<script type="module" src="/shared/retired-2d.js"></script>
</body>
</html>
