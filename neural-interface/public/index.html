<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SynApp</title>
<meta name="theme-color" content="#0e0e10">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://db.onlinewebfonts.com/c/3284c3a32cf946466fb963369b3c5b2d?family=Disket+Mono" rel="stylesheet">
<link rel="stylesheet" href="/shared/styles.css">
<!-- three.js is vendored (scripts/build-vendor.mjs); only the map renderer imports it.
     The import map must come before any module load, the preload included. -->
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/three-0.169.0.min.js"
  }
}
</script>
<link rel="modulepreload" href="/vendor/three/three-0.169.0.min.js">
<style>
  /* ═══════════════════════════════════════════
     3D VARIANT — Memory map
     ═══════════════════════════════════════════ */
  #graph-container { background: #07080b; }
  #map-status {
    position: absolute; top: 14px; left: 50%; transform: translate(-50%, -6px);
    padding: 6px 14px; border-radius: 999px; z-index: 5; pointer-events: none;
    font: 500 12px Inter, system-ui, sans-serif; letter-spacing: 0.02em;
    color: rgba(230,236,250,0.85); background: rgba(14,16,22,0.72);
    border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(8px);
    opacity: 0; transition: opacity 0.25s, transform 0.25s;
  }
  #map-status.visible { opacity: 1; transform: translate(-50%, 0); }
  #map-status.error { color: rgba(255,190,170,0.9); }
</style>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{})</script>
<script>
  // Start both data requests before any module loads: the map paints as soon as
  // /api/map lands, and the memory list is already on its way.
  window.__synPrefetch = {
    map: fetch('/api/map').then((r) => r.ok ? r.json().then((j) => { j._etag = r.headers.get('ETag'); return j; }) : null).catch(() => null),
    memories: fetch('/api/memories?links=false&fields=graph')
      .then((r) => r.ok ? r.json() : { error: new Error('HTTP ' + r.status) })
      .catch((error) => ({ error })),
  };
</script>
</head>
<body>

<!-- html2canvas for card screenshot MCP tool -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>

<script type="module" src="/variant/3d/main.js"></script>
</body>
</html>
