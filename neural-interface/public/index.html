<script>
  // Start the requests the first frame and the map wait for before any module loads: the stored UI state and the
  // English strings (storage.js and i18n.js take them, once), the server's health (app.js boot), the map (it paints
  // as soon as /api/map lands) and the first page of the memory list (shared/memory-list.js reads the others; the
  // address must stay memoryPageUrl(0): each page's answer is kept by its URL, for its 304).
  (function () {
    function early(url) { var p = fetch(url); p.catch(function () {}); return p; }
    window.__synPrefetch = {
      early: {
        '/api/ui-state': early('/api/ui-state'),
        '/i18n/en.json': early('/i18n/en.json'),
        '/api/health': early('/api/health'),
      },
      map: fetch('/api/map').then((r) => r.ok ? r.json().then((j) => { j._etag = r.headers.get('ETag'); return j; }) : null).catch(() => null),
      memories: fetch('/api/memories?links=false&fields=graph&offset=0&limit=2500')
        .then((r) => r.ok ? r.json() : { error: new Error('HTTP ' + r.status) })
        .catch((error) => ({ error })),
    };
  })();
</script>

<script id="loading-diagnostics">
  // This first frame and its retry can both run before any module downloads.
  // Journal those events immediately. The reporter drains them under their original page IDs.
  try {
    const key = 'synabun-loading-diagnostics-early-v1';
    let early = [];
    try {
      const saved = JSON.parse(sessionStorage.getItem(key));
      if (Array.isArray(saved)) early = saved.slice(-200);
    } catch {}
    const pageId = Array.from(crypto.getRandomValues(new Uint8Array(6)), n => n.toString(16).padStart(2, '0')).join('');
    const bootTag = id => typeof id === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id)
      ? id.slice(0, 8).toLowerCase() : '';
    let currentBoot = '';
    let append = entry => {
      early.push(entry);
      if (early.length > 200) early.shift();
      try { sessionStorage.setItem(key, JSON.stringify(early)); } catch {}
    };
    globalThis.synabunLoadingDiagnostics = {
      setBoot(id) { currentBoot = bootTag(id); },
      record(event, data = {}) {
        if ('seenBoot' in data) data = { ...data, seenBoot: bootTag(data.seenBoot) };
        append({ iso: new Date().toISOString(), pageId, currentBoot, visibility: document.visibilityState, event, data });
      },
    };
    globalThis.synabunLoadingDiagnostics.record('startup-shown');
    const send = globalThis.fetch.bind(globalThis);
    import('/shared/client-diagnostics.js').then(({ createLoadingDiagnostics }) => {
      append = createLoadingDiagnostics(globalThis, { send, early });
      early = [];
      try { sessionStorage.removeItem(key); } catch {}
    }).catch(() => {});
  } catch { /* A storage or platform failure must not interrupt startup. */ }
</script>
<script id="startup-recovery">
  // Keep the branded overlay usable even when the module graph never arrives.
  (() => {
    const element = id => document.getElementById(id);
    const overlay = element('loading-overlay');
    const fallback = {
      connecting: ["Connecting", "Conectando"],
      initializingNeural: ["Initializing neural pathways...", "Inicializando conexões neurais..."],
      retryConnection: ["Retry Connection", "Tentar conectar novamente"],
      serverOffline: ["Server Offline", "Servidor offline"],
      serverNotRunning: ["The Neural Interface server is not running", "O servidor do Neural Interface não está em execução"],
      connectionFailed: ["Connection Failed", "Falha na conexão"],
      somethingWrong: ["Something went wrong. Try again.", "Algo deu errado. Tente novamente."],
      connectedLoading: ["Connected! Loading...", "Conectado! Carregando..."],
    };
    // The server-backed locale becomes available at handoff. Use locally available preferences until then.
    let saved;
    try { saved = localStorage.getItem('synabun-locale'); } catch {}
    const tags = [new URLSearchParams(location.search).get('lang'), saved, navigator.language, ...(navigator.languages || [])];
    const portuguese = /^pt/i.test(tags.find(tag => /^(en|pt)(-|$)/i.test(tag)));
    const earlyLabel = key => fallback[key][portuguese ? 1 : 0];
    let label = earlyLabel;
    let adopted = false;
    function render(title, sub, retry) {
      element('loading-text').textContent = label(title);
      element('loading-sub').textContent = label(sub);
      element('loading-retry-label').textContent = label('retryConnection');
      overlay.classList.toggle('startup-retry', retry);
      overlay.classList.toggle('error', title === 'serverOffline' || title === 'connectionFailed');
    }
    render('connecting', 'initializingNeural', false);
    // This document is always fetched from the network; the modules may come from a cache. A shell from before the
    // handoff inserts an overlay of its own ahead of this one and drives that one (getElementById finds the first):
    // this one then has to go, or it stays over the loaded app. Whatever version of the modules ran, the app
    // owns the overlay once its shell mounted, and nothing here runs after boot-complete.
    const record = (event, data) => globalThis.synabunLoadingDiagnostics?.record(event, data);
    let settled = false;
    let checkTimer = null;
    let checking = null;
    let watcher = null;
    function yieldToShell() {
      if (!overlay.isConnected || element('loading-overlay') === overlay) return false;
      overlay.remove();
      return true;
    }
    function stopChecking() {
      clearTimeout(checkTimer);
      checkTimer = null;
      const aborted = !!checking;
      checking?.abort();
      checking = null;
      watcher?.disconnect();
      watcher = null;
      return aborted;
    }
    function takeOver(mode) {
      if (adopted) return;
      adopted = true;
      stopChecking();
      record('startup-adopt', { mode });
    }
    if (typeof MutationObserver === 'function') {
      watcher = new MutationObserver(() => { if (yieldToShell()) takeOver('duplicate'); });
      watcher.observe(document.body, { childList: true });
    }
    window.synabunAdoptLoading = translate => {
      takeOver(yieldToShell() ? 'duplicate' : 'adopted');
      label = key => {
        const name = 'loading.' + key;
        const value = translate(name);
        return value === name && fallback[key] ? earlyLabel(key) : value;
      };
      render('connecting', 'initializingNeural', false);
      element('loading-action-label').textContent = label('startServer');
      element('loading-server-cmd-hint').textContent = label('runCommand');
      element('loading-cmd-copy').title = label('copyToClipboard');
    };
    element('loading-retry-btn').addEventListener('click', event => {
      if (!overlay.classList.contains('startup-retry') || overlay.classList.contains('server-offline')) return;
      event.stopImmediatePropagation();
      location.reload();
    }, true);
    let sawOffline = false;
    let entryFailed = false;
    let reloadScheduled = false;
    let lastStatus = '';
    function reportStatus(reason) {
      if (lastStatus !== reason) globalThis.synabunLoadingDiagnostics?.record('startup-status', { reason });
      lastStatus = reason;
    }
    // A module graph that failed to load stays failed in this document, even if
    // the server has already recovered by the time the first probe runs.
    addEventListener('error', event => {
      if (event.target?.getAttribute?.('src') === '/variant/3d/main.js') {
        entryFailed = true;
        globalThis.synabunLoadingDiagnostics?.record('import-failed', { module: 'entry' });
      }
    }, true);
    // Both graphs share one retry across the failed reload chain. A completed boot
    // releases it immediately. After five minutes a fresh load can also retry.
    addEventListener('synabun:boot-complete', () => {
      try {
        if (history.state?.startupRetried) {
          const { startupRetried, ...state } = history.state;
          history.replaceState(state, '');
        }
      } catch {}
      globalThis.synabunLoadingDiagnostics?.record('boot-complete');
      if (settled) return;
      settled = true;
      // The fallback is over for this document: no probe, no status, no retry screen after the app has loaded.
      const aborted = stopChecking();
      const removed = yieldToShell();
      // An overlay nothing adopted (no shell took it, no shell replaced it) is hidden here; the module's
      // hideLoading hides the adopted one.
      const hidden = !adopted && !removed && overlay.isConnected;
      if (hidden) {
        overlay.classList.add('hidden');
        setTimeout(() => { if (overlay.classList.contains('hidden')) overlay.classList.add('gone'); }, 600);
      }
      record('boot-cleanup', { adopted, removed, hidden, aborted });
    });
    function retryHealthyStartup() {
      if (reloadScheduled) return;
      try {
        const last = history.state?.startupRetried;
        const now = Date.now();
        if (!Number.isFinite(last) || now < last || now - last >= 300000) {
          history.replaceState({ ...history.state, startupRetried: now }, '');
          if (entryFailed) globalThis.synabunLoadingDiagnostics?.record('import-retry', { module: 'entry' });
          globalThis.synabunLoadingDiagnostics?.record('reload-scheduled', { reason: 'startup' });
          reloadScheduled = true;
          location.reload();
          return;
        }
      } catch { /* Manual retry is still available if the guard cannot be saved. */ }
      entryFailed = true;
      reportStatus('manual-retry');
      render('connectionFailed', 'somethingWrong', true);
    }
    addEventListener('synabun:startup-module-failed', retryHealthyStartup);
    async function checkStartup() {
      checkTimer = null;
      if (adopted || settled) return;
      if (yieldToShell()) return takeOver('duplicate');
      overlay.classList.add('startup-retry');
      let healthy = false;
      let bootId;
      const request = checking = new AbortController();
      try {
        // Without AbortSignal.any a boot-complete cannot cut the request short; the check below still drops its answer.
        const timeout = AbortSignal.timeout(3000);
        const signal = AbortSignal.any ? AbortSignal.any([request.signal, timeout]) : timeout;
        const response = await fetch('/api/health', { cache: 'no-store', signal });
        const health = response.ok && await response.json();
        healthy = health?.ok === true && !health.restarting;
        bootId = health?.bootId;
      } catch {}
      if (checking === request) checking = null;
      if (adopted || settled) return;
      if (bootId) globalThis.synabunLoadingDiagnostics?.setBoot(bootId);
      if (healthy && (entryFailed || sawOffline)) {
        retryHealthyStartup();
        return;
      }
      if (!healthy) sawOffline = true;
      reportStatus(healthy ? 'loading' : 'offline');
      render(healthy ? 'connecting' : 'serverOffline', healthy ? 'connectedLoading' : 'serverNotRunning', true);
      checkTimer = setTimeout(checkStartup, 3000);
    }
    checkTimer = setTimeout(checkStartup, 12000);
  })();
</script>
