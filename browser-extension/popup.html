<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SynaBun Browser Bridge</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="popup.css"><body>
<!-- The toolbar popup (docs/design/browser-extension: "Extension popup"). Am I connected, what may agents use, which
     tabs do they hold. Every word comes from popup-strings.js in the browser's language (popup.js fills it in); what
     the popup shows is decided by popup-view.js. -->
<div class="popup" id="popup" data-state="loading" aria-busy="true">
  <header class="p-head">
    <div class="p-brand"><img src="icons/icon-32.png" alt="" width="32" height="32"><div class="p-brand-text"><strong>SynaBun</strong><small id="p-brand-sub"></small></div></div>
    <button type="button" class="p-icon-btn" id="p-open-app" data-action="open-app" aria-label="Open SynaBun" title="Open SynaBun"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></button>
  </header>

  <section class="p-section p-top" aria-labelledby="p-status-title">
    <div class="p-status" id="p-status" data-tone="">
      <span class="p-status-symbol" aria-hidden="true">
        <svg class="p-sym" data-sym="good" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"></path></svg>
        <svg class="p-sym" data-sym="warn" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"></path></svg>
        <svg class="p-sym" data-sym="sync" viewBox="0 0 24 24"><path d="M20 7a9 9 0 0 0-15-1L2 9m0-6v6h6M4 17a9 9 0 0 0 15 1l3-3m0 6v-6h-6"></path></svg>
        <svg class="p-sym" data-sym="bad" viewBox="0 0 24 24"><path d="m12 3 10 18H2L12 3ZM12 9v5M12 17h.01"></path></svg>
        <svg class="p-sym" data-sym="link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"></path></svg>
      </span>
      <div class="p-status-body">
        <h1 class="p-status-title" id="p-status-title" tabindex="-1"></h1>
        <p class="p-status-help" id="p-status-help"></p>
        <div class="p-actions" id="p-status-actions" hidden><button type="button" class="p-btn p-btn-primary" id="p-primary" hidden></button></div>
      </div>
    </div>

    <div class="p-mode" id="p-mode" hidden>
      <span class="p-label" id="p-mode-label"></span>
      <div class="p-dropdown" id="p-mode-dropdown">
        <button type="button" class="p-dropdown-trigger" id="p-mode-trigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="p-mode-list" aria-labelledby="p-mode-label p-mode-value"><span id="p-mode-value"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        <div class="p-dropdown-menu" id="p-mode-list" role="listbox" aria-labelledby="p-mode-label" hidden>
          <div class="p-dropdown-item" role="option" id="p-mode-full" data-value="full" aria-selected="true"></div>
          <div class="p-dropdown-item" role="option" id="p-mode-restricted" data-value="restricted" aria-selected="false"></div>
        </div>
      </div>
      <p class="p-mode-help" id="p-mode-help"></p>
    </div>
  </section>

  <section class="p-section" id="p-activity" aria-labelledby="p-activity-title" hidden>
    <div class="p-section-title"><h2 id="p-activity-title" tabindex="-1"></h2><span id="p-activity-count"></span></div>
    <p class="p-caption" id="p-activity-summary"></p>
    <div class="p-tab-list" id="p-groups"></div>
    <div class="p-empty" id="p-empty" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="15" height="13" rx="2"></rect><path d="M7 3h12a2 2 0 0 1 2 2v11M3 11h15"></path></svg>
      <h3 id="p-empty-title"></h3><p id="p-empty-help"></p>
    </div>
    <p class="p-helper" id="p-activity-help"></p>
  </section>

  <section class="p-section" id="p-shared" aria-labelledby="p-shared-title" hidden>
    <h2 id="p-shared-title"></h2>
    <div class="p-list" id="p-sites"></div>
    <div class="p-empty" id="p-shared-empty" hidden><h3 id="p-shared-empty-title"></h3><p id="p-shared-empty-help"></p></div>
    <h3 class="p-subhead" id="p-waiting-title" hidden></h3>
    <div class="p-list" id="p-waiting"></div>
    <div class="p-actions"><button type="button" class="p-btn p-btn-primary" id="share" data-action="share"></button><button type="button" class="p-btn" id="site" data-action="site"></button></div>
    <label class="p-check"><input type="checkbox" id="newTabs"><span id="p-newtabs-label"></span></label>
  </section>

  <details class="p-details" id="p-files" hidden>
    <summary id="p-files-summary"></summary>
    <div class="p-details-body">
      <label class="p-check"><input type="checkbox" id="downloads"><span id="p-downloads-label"></span></label>
      <p id="p-download-note"></p>
      <p class="p-notice" id="p-downloads-denied" role="status" hidden></p>
      <h3 id="p-upload-title"></h3>
      <p id="p-upload-help"></p>
      <p id="p-limits"></p>
      <details class="p-details p-details-nested" id="p-connection">
        <summary id="p-connection-summary"></summary>
        <p class="p-details-body"><span id="p-bridge-label"></span> <code id="p-bridge"></code></p>
      </details>
    </div>
  </details>

  <details class="p-details" id="p-pair-code" hidden>
    <summary id="p-pair-summary"></summary>
    <form class="p-details-body p-pair" id="pair">
      <p id="p-pair-help"></p>
      <label class="p-field" for="port"><span id="p-port-label"></span><input id="port" type="number" min="1024" max="65535" value="3345" inputmode="numeric"></label>
      <label class="p-field" for="code"><span id="p-code-label"></span><input id="code" autocomplete="off" spellcheck="false" maxlength="24"></label>
      <button class="p-btn" id="p-pair-submit" type="submit"></button>
    </form>
  </details>

  <footer class="p-footer" id="p-footer">
    <button type="button" class="p-btn p-btn-ghost" id="p-footer-app" data-action="open-app"></button>
    <span class="p-footer-end">
      <button type="button" class="p-btn p-btn-ghost" id="disconnect" data-action="confirm-disconnect" hidden></button>
      <button type="button" class="p-btn p-btn-ghost p-btn-danger" id="revoke" data-action="confirm-revoke" hidden></button>
    </span>
    <div class="p-footer-end p-footer-tools">
      <button type="button" class="p-btn p-btn-ghost" id="p-open-extensions" data-action="open-extensions"></button>
      <button type="button" class="p-btn p-btn-ghost" id="p-reload-extension" data-action="reload-extension"></button>
    </div>
  </footer>

  <p class="p-sr-only" id="p-live" role="status" aria-live="polite"></p>
  <p class="p-toast" id="p-toast" role="status" aria-live="polite"></p>
</div>

<dialog class="p-dialog" id="p-confirm" aria-labelledby="p-confirm-title" aria-describedby="p-confirm-body">
  <h2 id="p-confirm-title"></h2>
  <p id="p-confirm-body"></p>
  <div class="p-actions p-dialog-actions"><button type="button" class="p-btn" id="p-confirm-cancel" data-action="cancel-confirm"></button><button type="button" class="p-btn" id="p-confirm-ok" data-action="do-confirm"></button></div>
</dialog>
<script type="module" src="popup.js"></script></body></html>
