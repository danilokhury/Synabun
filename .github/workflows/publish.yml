name: Publish to npm
run-name: ${{ github.event_name == 'workflow_dispatch' && format('npm {0} {1} {2}', inputs.version, inputs.commit, inputs.request_id) || format('npm release {0}', github.event.release.tag_name) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable prepared package version
        required: true
        type: string
      commit:
        description: Exact prepared main commit (40 lowercase hex characters)
        required: true
        type: string
      request_id:
        description: Unique owner command UUID (used for exact run correlation)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

# Serialize registry writes; superseded queued requests fail closed in the owner command.
concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  # These two jobs share the same checks. Permissions differ so npm-only dispatch
  # gets read access; only release fallback may attach reports and notify Discord.
  publish:
    if: github.repository == 'danilokhury/Synabun' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    # Covers the build, the scan (30) and the wait for the registry to serve an accepted upload (60).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          # Dispatch always checks out its immutable main SHA, never an input ref.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          # No registry-url: OIDC publication uses isolated empty npm config files.
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            mcp-server/package-lock.json
            neural-interface/package-lock.json

      # No publication before the browser extension this tree pins is live on synabun.ai and is the pinned file. The
      # pin and the download code are the checked-out tree's own (Node built-ins only, nothing installed yet); a tree
      # without either fails. No input, condition or continue-on-error skips it (docs/release-pipeline.md).
      - name: Verify the pinned browser extension is live on synabun.ai
        run: node lib/release-extension-live.mjs

      - name: Verify event, workflow, repository, main commit and registry version
        id: registry
        run: node lib/release-npm-ci.mjs identity

      - name: Check root dependencies
        run: node lib/root-dependencies.mjs --check

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install MCP server dependencies
        run: npm --prefix mcp-server ci --ignore-scripts

      - name: Install Neural Interface dependencies
        run: npm --prefix neural-interface ci --ignore-scripts

      - name: Build MCP server
        run: npm run mcp:build

      - name: Inspect npm package
        run: npm run pack:check

      - name: Pack and scan npm tarball
        if: steps.registry.outputs.published != 'true'
        run: npm run release:publish -- --out "$RUNNER_TEMP/npm-release" --pack-only
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

      # Reports and exact bytes are retained BEFORE the registry PUT.
      - name: Preserve scan evidence before publication
        if: always() && steps.registry.outputs.published == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: npm-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/npm-release/npm-virustotal.*
            ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: ignore
          retention-days: 30

      # Install ONLY the publishing CLI separately; builder remains npm 10.9.3.
      - name: Install pinned OIDC-compatible publication CLI
        if: steps.registry.outputs.published != 'true'
        run: npm install --prefix "$RUNNER_TEMP/npm-oidc-cli" --ignore-scripts --no-audit --no-fund --package-lock=false npm@11.21.0

      - name: Publish scanned tarball with OIDC and verify registry SHA512
        if: steps.registry.outputs.published != 'true'
        run: node lib/release-npm-ci.mjs publish
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

      - name: Upload verified publication handoff
        if: success() && steps.registry.outputs.published == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: npm-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/npm-release/npm-publication.json
            ${{ runner.temp }}/npm-release/npm-virustotal.json
            ${{ runner.temp }}/npm-release/npm-virustotal.md
            ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: error
          retention-days: 30

  fallback:
    if: github.repository == 'danilokhury/Synabun' && github.event_name == 'release'
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    # Covers the build, the scan (30) and the wait for the registry to serve an accepted upload (60).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          # Dispatch always checks out its immutable main SHA, never an input ref.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          # No registry-url: OIDC publication uses isolated empty npm config files.
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            mcp-server/package-lock.json
            neural-interface/package-lock.json

      # No publication before the browser extension this tree pins is live on synabun.ai and is the pinned file. The
      # pin and the download code are the checked-out tree's own (Node built-ins only, nothing installed yet); a tree
      # without either fails. No input, condition or continue-on-error skips it (docs/release-pipeline.md).
      - name: Verify the pinned browser extension is live on synabun.ai
        run: node lib/release-extension-live.mjs

      - name: Verify event, workflow, repository, main commit and registry version
        id: registry
        run: node lib/release-npm-ci.mjs identity

      - name: Check root dependencies
        run: node lib/root-dependencies.mjs --check

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install MCP server dependencies
        run: npm --prefix mcp-server ci --ignore-scripts

      - name: Install Neural Interface dependencies
        run: npm --prefix neural-interface ci --ignore-scripts

      - name: Build MCP server
        run: npm run mcp:build

      - name: Inspect npm package
        run: npm run pack:check

      - name: Pack and scan npm tarball
        if: steps.registry.outputs.published != 'true'
        run: npm run release:publish -- --out "$RUNNER_TEMP/npm-release" --pack-only
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

      # Reports and exact bytes are retained BEFORE the registry PUT.
      - name: Preserve scan evidence before publication
        if: always() && steps.registry.outputs.published == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: npm-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/npm-release/npm-virustotal.*
            ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: ignore
          retention-days: 30

      # release.published remains a fallback. Only its job needs contents: write.
      - name: Attach npm verification reports and exact tarball
        if: steps.registry.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber
          "$RUNNER_TEMP/npm-release/npm-virustotal.json"
          "$RUNNER_TEMP/npm-release/npm-virustotal.md"
          "$RUNNER_TEMP/npm-release/"*.tgz

      # Install ONLY the publishing CLI separately; builder remains npm 10.9.3.
      - name: Install pinned OIDC-compatible publication CLI
        if: steps.registry.outputs.published != 'true'
        run: npm install --prefix "$RUNNER_TEMP/npm-oidc-cli" --ignore-scripts --no-audit --no-fund --package-lock=false npm@11.21.0

      - name: Publish scanned tarball with OIDC and verify registry SHA512
        if: steps.registry.outputs.published != 'true'
        run: node lib/release-npm-ci.mjs publish
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

      - name: Upload verified publication handoff
        if: success() && steps.registry.outputs.published == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: npm-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/npm-release/npm-publication.json
            ${{ runner.temp }}/npm-release/npm-virustotal.json
            ${{ runner.temp }}/npm-release/npm-virustotal.md
            ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Notify Discord changelog
        if: success() && github.event_name == 'release'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          node -e '
            const payload = {
              content: "@everyone",
              allowed_mentions: { parse: ["everyone"] },
              embeds: [{
                title: "SynaBun " + process.env.RELEASE_TAG + " is live on npm",
                url: process.env.RELEASE_URL,
                color: 5763719,
                description: "A new version has been published.\n\nUpdate:\n```\nnpm i -g synabun@latest\n```\n\n[View release notes](" + process.env.RELEASE_URL + ")",
                timestamp: new Date().toISOString()
              }]
            };
            fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(payload)
            }).then(async (response) => {
              if (!response.ok) {
                throw new Error("Discord webhook failed: " + response.status + " " + await response.text());
              }
            }).catch((error) => {
              console.error(error);
              process.exit(1);
            });
          '

  # Tells synabun.ai to re-read the releases now instead of at its hourly check.
  # Runs after the release job has finished, passed or failed, so the notes and
  # attached reports are final. Uses no GITHUB_TOKEN and never fails the release:
  # without the secret it only leaves a notice.
  notify-website:
    needs: fallback
    if: always() && github.repository == 'danilokhury/Synabun' && github.event_name == 'release'
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Notify synabun.ai website
        env:
          DISPATCH_TOKEN: ${{ secrets.SYNABUN_WEBSITE_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_URL: https://api.github.com/repos/danilokhury/SynaBunWebsite/dispatches
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::notice title=Website not notified::Secret SYNABUN_WEBSITE_DISPATCH_TOKEN is not set, so synabun.ai picks up $RELEASE_TAG at its hourly check. Add a fine-grained token for danilokhury/SynaBunWebsite (Contents: read and write) under Settings > Secrets and variables > Actions."
            exit 0
          fi
          payload=$(jq -nc --arg tag "$RELEASE_TAG" '{event_type: "synabun-release", client_payload: {tag: $tag}}')
          answer="$RUNNER_TEMP/website-dispatch.txt"
          for attempt in 1 2; do
            status=$(curl --silent --show-error --output "$answer" --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header "Authorization: Bearer $DISPATCH_TOKEN" \
              --data "$payload" "$DISPATCH_URL") || status=000
            case "$status" in
              2??) echo "synabun.ai notified of $RELEASE_TAG (HTTP $status)."; exit 0 ;;
              000|408|429|5??)
                if [ "$attempt" = 1 ]; then echo "Dispatch answered HTTP $status; retrying in 10 s."; sleep 10; continue; fi ;;
            esac
            break
          done
          case "$status" in
            401) reason='the token is invalid or expired; replace the SYNABUN_WEBSITE_DISPATCH_TOKEN secret' ;;
            403|404) reason='the token cannot reach danilokhury/SynaBunWebsite or lacks Contents: read and write; replace the SYNABUN_WEBSITE_DISPATCH_TOKEN secret' ;;
            000) reason='GitHub could not be reached; re-run this job' ;;
            *) reason='GitHub refused the dispatch; re-run this job' ;;
          esac
          echo "::error title=Website not notified::HTTP $status: $reason. synabun.ai still picks up $RELEASE_TAG at its hourly check."
          cat "$answer" 2>/dev/null || true
          exit 1
