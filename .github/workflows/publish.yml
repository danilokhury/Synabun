name: Publish to npm
run-name: ${{ github.event_name == 'workflow_dispatch' && format('npm {0} {1} {2}', inputs.version, inputs.commit, inputs.request_id) || format('npm release {0}', github.event.release.tag_name) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable prepared package version
        required: true
        type: string
      commit:
        description: Exact prepared main commit (40 lowercase hex characters)
        required: true
        type: string
      request_id:
        description: Unique owner command UUID (used for exact run correlation)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

# Serialize registry writes; superseded queued requests fail closed in the owner command.
concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  # These two jobs share the same checks. Permissions differ so npm-only dispatch
  # gets read access; only release fallback may attach reports and notify Discord.
  publish:
    if: github.repository == 'danilokhury/Synabun' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Dispatch always checks out its immutable main SHA, never an input ref.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          # No registry-url: OIDC publication uses isolated empty npm config files.
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            mcp-server/package-lock.json
            neural-interface/package-lock.json

      - name: Verify event, workflow, repository, main commit and registry version
        id: registry
        run: node lib/release-npm-ci.mjs identity

      - name: Check root dependencies
        run: node lib/root-dependencies.mjs --check

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install MCP server dependencies
        run: npm --prefix mcp-server ci --ignore-scripts

      - name: Install Neural Interface dependencies
        run: npm --prefix neural-interface ci --ignore-scripts

      - name: Build MCP server
        run: npm run mcp:build

      - name: Inspect npm package
        run: npm run pack:check

      - name: Pack and scan npm tarball
        if: steps.registry.outputs.published != 'true'
        run: npm run release:publish -- --out "$RUNNER_TEMP/npm-release" --pack-only
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

      # Reports and exact bytes are retained BEFORE the registry PUT.
      - name: Preserve scan evidence before publication
        if: always() && steps.registry.outputs.published == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: npm-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/npm-release/npm-virustotal.*
            ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: ignore
          retention-days: 30

      # Install ONLY the publishing CLI separately; builder remains npm 10.9.3.
      - name: Install pinned OIDC-compatible publication CLI
        if: steps.registry.outputs.published != 'true'
        run: npm install --prefix "$RUNNER_TEMP/npm-oidc-cli" --ignore-scripts --no-audit --no-fund --package-lock=false npm@11.21.0

      - name: Publish scanned tarball with OIDC and verify registry SHA512
        if: steps.registry.outputs.published != 'true'
        run: node lib/release-npm-ci.mjs publish
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

      - name: Upload verified publication handoff
        if: success() && steps.registry.outputs.published == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: npm-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/npm-release/npm-publication.json
            ${{ runner.temp }}/npm-release/npm-virustotal.json
            ${{ runner.temp }}/npm-release/npm-virustotal.md
            ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: error
          retention-days: 30

  fallback:
    if: github.repository == 'danilokhury/Synabun' && github.event_name == 'release'
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Dispatch always checks out its immutable main SHA, never an input ref.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          # No registry-url: OIDC publication uses isolated empty npm config files.
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            mcp-server/package-lock.json
            neural-interface/package-lock.json

      - name: Verify event, workflow, repository, main commit and registry version
        id: registry
        run: node lib/release-npm-ci.mjs identity

      - name: Check root dependencies
        run: node lib/root-dependencies.mjs --check

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install MCP server dependencies
        run: npm --prefix mcp-server ci --ignore-scripts

      - name: Install Neural Interface dependencies
        run: npm --prefix neural-interface ci --ignore-scripts

      - name: Build MCP server
        run: npm run mcp:build

      - name: Inspect npm package
        run: npm run pack:check

      - name: Pack and scan npm tarball
        if: steps.registry.outputs.published != 'true'
        run: npm run release:publish -- --out "$RUNNER_TEMP/npm-release" --pack-only
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

      # Reports and exact bytes are retained BEFORE the registry PUT.
      - name: Preserve scan evidence before publication
        if: always() && steps.registry.outputs.published == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: npm-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/npm-release/npm-virustotal.*
            ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: ignore
          retention-days: 30

      # release.published remains a fallback. Only its job needs contents: write.
      - name: Attach npm verification reports and exact tarball
        if: steps.registry.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber
          "$RUNNER_TEMP/npm-release/npm-virustotal.json"
          "$RUNNER_TEMP/npm-release/npm-virustotal.md"
          "$RUNNER_TEMP/npm-release/"*.tgz

      # Install ONLY the publishing CLI separately; builder remains npm 10.9.3.
      - name: Install pinned OIDC-compatible publication CLI
        if: steps.registry.outputs.published != 'true'
        run: npm install --prefix "$RUNNER_TEMP/npm-oidc-cli" --ignore-scripts --no-audit --no-fund --package-lock=false npm@11.21.0

      - name: Publish scanned tarball with OIDC and verify registry SHA512
        if: steps.registry.outputs.published != 'true'
        run: node lib/release-npm-ci.mjs publish
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

      - name: Upload verified publication handoff
        if: success() && steps.registry.outputs.published == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: npm-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/npm-release/npm-publication.json
            ${{ runner.temp }}/npm-release/npm-virustotal.json
            ${{ runner.temp }}/npm-release/npm-virustotal.md
            ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Notify Discord changelog
        if: success() && github.event_name == 'release'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          node -e '
            const payload = {
              content: "@everyone",
              allowed_mentions: { parse: ["everyone"] },
              embeds: [{
                title: "SynaBun " + process.env.RELEASE_TAG + " is live on npm",
                url: process.env.RELEASE_URL,
                color: 5763719,
                description: "A new version has been published.\n\nUpdate:\n```\nnpm i -g synabun@latest\n```\n\n[View release notes](" + process.env.RELEASE_URL + ")",
                timestamp: new Date().toISOString()
              }]
            };
            fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(payload)
            }).then(async (response) => {
              if (!response.ok) {
                throw new Error("Discord webhook failed: " + response.status + " " + await response.text());
              }
            }).catch((error) => {
              console.error(error);
              process.exit(1);
            });
          '
