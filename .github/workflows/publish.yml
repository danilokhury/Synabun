name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install MCP server dependencies
        run: npm install
        working-directory: mcp-server

      - name: Build MCP server
        run: npx tsc
        working-directory: mcp-server

      - name: Run MCP server tests
        run: node ./node_modules/vitest/vitest.mjs run --passWithNoTests
        working-directory: mcp-server

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Notify Discord #changelog
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "content": "@everyone",
                 "allowed_mentions": { "parse": ["everyone"] },
                 "embeds": [{
                   "title": "🚀 SynaBun '${{ github.event.release.tag_name }}' is live on npm!",
                   "url": "${{ github.event.release.html_url }}",
                   "color": 5763719,
                   "description": "A new version has been published.\n\n**Update:**\n```\nnpm i -g synabun@latest\n```\n\n[View Release Notes](${{ github.event.release.html_url }})",
                   "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
                 }]
               }' \
               "${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}"
